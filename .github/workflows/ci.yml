name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: beco_test
          MYSQL_USER: beco_test
          MYSQL_PASSWORD: test-local-only
          MYSQL_ROOT_PASSWORD: root-test-local-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run test:integration
        env:
          BECO_ALLOW_TEST_RESET: 'yes'
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: '3306'
          TEST_DB_NAME: beco_test
          TEST_DB_USER: beco_test
          TEST_DB_PASSWORD: test-local-only
